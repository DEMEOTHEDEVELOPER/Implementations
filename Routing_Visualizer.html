        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;

              var originalNodes;
              var network;
              var container;
              var options, data;

Node #:  10\n        X position: 3.000001\n        Y position: 2.0\n        ", "x": 300.00010000000003, "y": -200.0}, {"color": "#97c2fc", "fixed": true, "id": 11, "label": 11, "shape": "dot", "title": "\n        Node #:  11\n        X position: 2.0\n        Y position: 5.000001\n        ", "x": 200.0, "y": -500.00010000000003}, {"color": "#97c2fc", "fixed": true, "id": 12, "label": 12, "shape": "dot", "title": "\n        Node #:  12\n        X position: 5.000001\n        Y position: 4.0\n        ", "x": 500.00010000000003, "y": -400.0}, {"color": "#97c2fc", "fixed": true, "id": 13, "label": 13, "shape": "dot", "title": "\n        Node #:  13\n        X position: 6.0\n        Y position: 1e-06\n        ", "x": 600.0, "y": -9.999999999999999e-05}, {"color": "#97c2fc", "fixed": true, "id": 14, "label": 14, "shape": "dot", "title": "\n        Node #:  14\n        X position: -8.0\n        Y position: -7.999999\n        ", "x": -800.0, "y": 799.9999}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
